<!DOCTYPE html>
<html>
<head>
    <title>NovaMind MNIST Digit Recognizer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #E6D5C3; 
            color: #2B1D14; 
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .bento-wrapper {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .bento-card {
            border: 3px solid #2B1D14;
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
        }

        .card-light {
            background-color: #F6F0E6; 
            color: #2B1D14;
        }

        .card-dark {
            background-color: #4A372A; 
            color: #F6F0E6; 
        }

        .header-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
        }

        .header-card h1 {
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .right-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .canvas-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .canvas-container p {
            margin: 0;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        canvas { 
            cursor: crosshair; 
            border: 3px solid #2B1D14; 
            border-radius: 6px;
            background-color: #000000;
        }

        .result-card {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .result-card h2 {
            font-size: 32px;
            margin: 0;
        }

        .controls-card {
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
        }

        button { 
            background-color: #6A4E3B; 
            color: #FFFFFF; 
            border: 3px solid #2B1D14; 
            border-radius: 6px; 
            padding: 15px; 
            font-size: 16px; 
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background-color 0.2s ease;
        }

        button:hover { 
            background-color: #7d5e48; 
        }
        
        button:active {
            transform: translateY(2px);
        }

        @media (max-width: 650px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="bento-wrapper">
        <header class="bento-card card-light header-card">
            <h1>NovaMind</h1>
            <strong>NUMPY ONLY</strong>
        </header>

        <div class="main-grid">
            
            <div class="bento-card card-dark canvas-container">
                <p>DRAW A DIGIT (0-9)</p>
                <canvas id="drawCanvas" width="280" height="280"></canvas>
            </div>

            <div class="right-column">
                
                <div class="bento-card card-light result-card">
                    <h2 id="result">PREDICTION: ?</h2>
                </div>

                <div class="bento-card card-dark controls-card">
                    <button onclick="clearCanvas()">Clear Canvas</button>
                    <button onclick="predict()">Predict Digit</button>
                </div>

            </div>
        </div>
    </div>

    <canvas id="resizeCanvas" width="28" height="28" style="display:none;"></canvas>

    <script>
        let weights = null;

        fetch('weights.json')
            .then(response => response.json())
            .then(data => { weights = data; console.log("Weights loaded!"); })
            .catch(err => console.error("Error loading weights:", err));

        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');
        
        function clearCanvas() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            document.getElementById('result').innerText = "PREDICTION: ?";
        }
        clearCanvas();

        let drawing = false;
        ctx.lineWidth = 25; 
        ctx.lineCap = 'round';
        ctx.strokeStyle = 'white'; 

        canvas.onmousedown = (e) => { drawing = true; ctx.beginPath(); };
        window.onmouseup = () => { drawing = false; };
        canvas.onmouseleave = () => { drawing = false; };
        
        canvas.onmousemove = (e) => {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
        };

        function matMul(X, W) {
            let result = new Array(W[0].length).fill(0);
            for (let i = 0; i < X.length; i++) {
                for (let j = 0; j < W[0].length; j++) {
                    result[j] += X[i] * W[i][j];
                }
            }
            return result;
        }

        function addBias(X, b) {
            return X.map((val, i) => val + b[0][i]);
        }

        function relu(X) {
            return X.map(val => Math.max(0, val));
        }

        function softmax(X) {
            const maxVal = Math.max(...X);
            const exps = X.map(val => Math.exp(val - maxVal));
            const sumExps = exps.reduce((a, b) => a + b, 0);
            return exps.map(val => val / sumExps);
        }

        function argmax(arr) {
            return arr.indexOf(Math.max(...arr));
        }

        function predict() {
            if (!weights) {
                alert("Weights are still loading!");
                return;
            }

            const imgDataRaw = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            let minX = canvas.width, minY = canvas.height, maxX = -1, maxY = -1;
            let isEmpty = true;

            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const i = (y * canvas.width + x) * 4;
                    if (imgDataRaw[i] > 0) { 
                        isEmpty = false;
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                    }
                }
            }

            if (isEmpty) {
                document.getElementById('result').innerText = "PREDICTION: ?";
                return;
            }

            const boxWidth = Math.max(1, maxX - minX);
            const boxHeight = Math.max(1, maxY - minY);
            const scale = 20.0 / Math.max(boxWidth, boxHeight);
            
            const scaledWidth = boxWidth * scale;
            const scaledHeight = boxHeight * scale;
            
            const dx = (28 - scaledWidth) / 2;
            const dy = (28 - scaledHeight) / 2;

            const resizeCanvas = document.getElementById('resizeCanvas');
            const resizeCtx = resizeCanvas.getContext('2d');
            
            resizeCtx.fillStyle = 'black';
            resizeCtx.fillRect(0, 0, 28, 28);
            resizeCtx.drawImage(
                canvas, 
                minX, minY, boxWidth, boxHeight, 
                dx, dy, scaledWidth, scaledHeight 
            );
            
            const imgData = resizeCtx.getImageData(0, 0, 28, 28).data;
            let input = [];
            for (let i = 0; i < imgData.length; i += 4) {
                input.push(imgData[i] / 255.0); 
            }

            let z1 = addBias(matMul(input, weights.W1), weights.b1);
            let a1 = relu(z1);
            
            let z2 = addBias(matMul(a1, weights.W2), weights.b2);
            let a2 = relu(z2);
            
            let z3 = addBias(matMul(a2, weights.W3), weights.b3);
            let probs = softmax(z3);
            
            let prediction = argmax(probs);
            document.getElementById('result').innerText = "PREDICTION: " + prediction;
        }
    </script>
</body>
</html>
